[project]
name = "recoll-audio-worker"
version = "0.1.0"
description = "Audio/video transcription worker using whisper.cpp for Recoll search indexing"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.0",
    "ruff>=0.16.1",
    "ty>=0.0.67",
]

[tool.ruff]
exclude = ["recoll-webui/**", "src/**"]

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "B",
    "BLE",
    "C4",
    "D",
    "E",
    "F",
    "FLY",
    "G",
    "I",
    "LOG",
    "PERF",
    "PIE",
    "PL",
    "PTH",
    "RET",
    "RUF",
    "S",
    "SIM",
    "T20",
    "TID",
    "UP",
    "W",
]
ignore = [
    "D105",
    "D107",
    "PLR0912",
    "PLR0913",
    "PLR2004",
    "S607",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api."typing.Any"]
msg = "typing.Any is banned — model the type explicitly instead"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D103",
    "S101",
    "S324",
    "PLC0415",
    "SIM117",
    "ANN",
    "E501",
    "S108",
    "PTH",
]
"transcribe.py" = [
    "D205",
    "D415",
    "S324",
    "PTH123",
    "S603",
    "E501",
    "S108",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ty.rules]
all = "error"

[tool.pytest.ini_options]
addopts = "-n 4 --dist=load --cov=transcribe --cov-report=term-missing --cov-report=xml --cov-fail-under=80 --cov-branch"
testpaths = ["tests"]

[tool.coverage.run]
source = ["transcribe"]
omit = ["tests/*", "__pycache__/*"]
concurrency = ["multiprocessing"]

[tool.coverage.report]
fail_under = 80
show_missing = true
branch = true