[project]
name = "recoll_wrapper"
version = "0.1.0"
description = "Recoll wrapper for indexing"
requires-python = ">=3.11"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.packages]
recoll_wrapper = { from = "." }

[tool.pytest.ini_options]
addopts = "--cov=. --cov-report=xml --cov-fail-under=80 --cov-branch"
testpaths = ["tests"]

[tool.coverage.run]
source = ["."]
branch = true

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]