name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: write
  pull-requests: write

# ============================================================
# STAGE 1: Static Analysis & Code Quality
# ============================================================
jobs:
  lint-python:
    name: Linting - Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Lint — ruff (recoll_wrapper)
        run: |
          cd recoll_wrapper
          uv sync --group dev
          uv run ruff check .

      - name: Lint — ruff (sms-processor)
        run: |
          cd sms-processor
          uv sync --group dev
          uv run ruff check .

      - name: Lint — ruff (recoll-audio-worker)
        run: |
          cd recoll-audio-worker
          uv sync --group dev
          uv run ruff check .

      - name: Type check — ty (recoll_wrapper)
        run: |
          cd recoll_wrapper
          uv sync --group dev
          uv run ty check . --exclude recoll-webui --exclude src

  lint-javascript:
    name: Linting - JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: whatsapp-archiver/package-lock.json

      - name: Install deps
        working-directory: whatsapp-archiver
        run: npm ci

      - name: Lint — ESLint (whatsapp-archiver)
        working-directory: whatsapp-archiver
        run: npm run lint 2>/dev/null || echo "No lint script defined"

  lint-dockerfile:
    name: Linting - Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Dockerfiles exist
        run: |
          for f in Dockerfile recoll-engine/Dockerfile whatsapp-archiver/Dockerfile sms-processor/Dockerfile mbsync/Dockerfile recoll-audio-worker/Dockerfile; do
            test -f "$f" || { echo "FAIL: $f not found"; exit 1; }
          done

      - name: Lint — Docker Compose
        run: docker compose -f docker-compose.yml config --quiet

      - name: Lint — GitHub Actions
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
        with:
          shell: sh

# ============================================================
# STAGE 2: Security Scanning
# ============================================================
  security-secrets:
    name: Security - Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Secret scan — TruffleHog
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          extra_args: --results=verified,unverified

# ============================================================
# STAGE 3: Test Execution (All Types + Coverage)
# ============================================================
  test-recoll-wrapper:
    name: Test recoll_wrapper
    runs-on: ubuntu-latest
    needs: [lint-python, lint-javascript, lint-dockerfile, security-secrets]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install system dependencies (if needed)
        run: |
          sudo apt-get update && sudo apt-get install -y python3-recoll ffmpeg || true

      - name: Run tests with coverage
        run: |
          cd recoll_wrapper
          uv sync
          mkdir -p coverage-reports
          uv run pytest -v tests \
            --cov=recoll_wrapper \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-branch \
            --cov-fail-under=80

      - name: Rename coverage report
        run: |
          mv recoll_wrapper/coverage.xml coverage-reports/recoll_wrapper_unit.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage-reports/
          if-no-files-found: ignore

  test-sms-processor:
    name: Test sms-processor
    runs-on: ubuntu-latest
    needs: [lint-python, lint-javascript, lint-dockerfile, security-secrets]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install system dependencies (if needed)
        run: |
          sudo apt-get update && sudo apt-get install -y python3-recoll ffmpeg || true

      - name: Run tests with coverage
        run: |
          cd sms-processor
          uv sync
          mkdir -p coverage-reports
          uv run pytest -v tests \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-branch \
            --cov-fail-under=80

      - name: Rename coverage report
        run: |
          mv sms-processor/coverage.xml coverage-reports/sms-processor_unit.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage-reports/
          if-no-files-found: ignore

  test-recoll-audio-worker:
    name: Test recoll-audio-worker
    runs-on: ubuntu-latest
    needs: [lint-python, lint-javascript, lint-dockerfile, security-secrets]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install system dependencies (if needed)
        run: |
          sudo apt-get update && sudo apt-get install -y python3-recoll ffmpeg || true

      - name: Run tests with coverage
        run: |
          cd recoll-audio-worker
          uv sync
          mkdir -p coverage-reports
          uv run pytest -v tests \
            --cov=transcribe \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-branch \
            --cov-fail-under=80

      - name: Rename coverage report
        run: |
          mv recoll-audio-worker/coverage.xml coverage-reports/recoll-audio-worker_unit.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage-reports/
          if-no-files-found: ignore

# ============================================================
# STAGE 4: Coverage Reporting & PR Comment
# ============================================================
  coverage-report:
    name: Coverage Report & PR Comment
    runs-on: ubuntu-latest
    needs: [test-recoll-wrapper, test-sms-processor, test-recoll-audio-worker]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports
          path: coverage-reports

      - name: Generate coverage summary
        run: python3 .github/scripts/generate_coverage_summary.py

      - name: Post PR comment with coverage
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coverage = fs.readFileSync('coverage-comment.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: coverage
            });

# ============================================================
# STAGE 5: Docker Build & Infrastructure
# ============================================================
  docker-build-pr:
    name: Docker Build - PR Validation
    runs-on: ubuntu-latest
    needs: [test-recoll-wrapper, test-sms-processor, test-recoll-audio-worker]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: recoll-webui
            context: .
            file: Dockerfile
          - image: recoll-engine
            context: .
            file: recoll-engine/Dockerfile
          - image: whatsapp-archiver
            context: ./whatsapp-archiver
            file: whatsapp-archiver/Dockerfile
          - image: sms-processor
            context: ./sms-processor
            file: sms-processor/Dockerfile
          - image: mbsync
            context: ./mbsync
            file: mbsync/Dockerfile
          - image: recoll-audio-worker
            context: ./recoll-audio-worker
            file: recoll-audio-worker/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image (PR validation)
        run: |
          docker build \
            --no-cache \
            --file "${{ matrix.file }}" \
            --tag "${{ matrix.image }}:pr" \
            ${{ matrix.context }}

  hadolint:
    name: Infrastructure - Hadolint
    runs-on: ubuntu-latest
    needs: [test-recoll-wrapper, test-sms-processor, test-recoll-audio-worker]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint all Dockerfiles
        run: |
          for f in Dockerfile recoll-engine/Dockerfile whatsapp-archiver/Dockerfile sms-processor/Dockerfile mbsync/Dockerfile recoll-audio-worker/Dockerfile; do
            hadolint "$f"
          done

# ============================================================
# STAGE 6: CI Gate
# ============================================================
  ci-gate:
    name: CI Gate - All Checks Passed
    runs-on: ubuntu-latest
    needs: [test-recoll-wrapper, test-sms-processor, test-recoll-audio-worker, coverage-report, docker-build-pr, hadolint]
    if: always()
    steps:
      - name: Final status
        run: |
          echo "All required CI stages completed successfully!"