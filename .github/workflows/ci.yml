name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Lint — ruff (recoll_wrapper)
        run: cd recoll_wrapper && uv run ruff check .

      - name: Lint — ruff (sms-processor)
        run: cd sms-processor && uv run ruff check .

      - name: Lint — ruff (recoll-audio-worker)
        run: cd recoll-audio-worker && uv run ruff check .

      - name: Type check — ty
        run: cd recoll_wrapper && uv run ty check . --exclude recoll-webui --exclude src

      - name: Validate Dockerfiles exist
        run: |
          for f in Dockerfile recoll-engine/Dockerfile whatsapp-archiver/Dockerfile sms-processor/Dockerfile; do
            test -f "$f" || { echo "FAIL: $f not found"; exit 1; }
          done

      - name: Lint — Docker Compose
        run: docker compose -f docker-compose.yml config --quiet

      - name: Lint — GitHub Actions
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
        with:
          shell: sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Secret scan — TruffleHog
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          extra_args: --results=verified,unverified

  test:
    runs-on: ubuntu-latest
    needs: [lint, secrets]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # ---- Python tests (recoll_wrapper) ----
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Recoll wrapper — tests + coverage (80%)
        run: cd recoll_wrapper && uv run pytest -v

      # ---- JavaScript tests (whatsapp-archiver) ----
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: whatsapp-archiver/package-lock.json

      - name: WhatsApp archiver — install deps
        working-directory: whatsapp-archiver
        run: npm ci

      - name: WhatsApp archiver — tests + coverage (80%)
        working-directory: whatsapp-archiver
        run: npm test

      # ---- Python tests (sms-processor) ----
      - name: SMS processor — tests
        run: cd sms-processor && uv run pytest -v

      # ---- Python tests (recoll-audio-worker) ----
      - name: Audio worker — tests
        run: cd recoll-audio-worker && uv run pytest -v

  hadolint:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Lint — Dockerfile
        id: hl-root
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          file: Dockerfile
          args: --config .hadolint
          output-file: hadolint-root.txt
          no-color: true
          no-fail: true

      - name: Lint — recoll-engine/Dockerfile
        id: hl-engine
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          file: recoll-engine/Dockerfile
          args: --config .hadolint
          output-file: hadolint-engine.txt
          no-color: true
          no-fail: true

      - name: Lint — whatsapp-archiver/Dockerfile
        id: hl-whatsapp
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          file: whatsapp-archiver/Dockerfile
          args: --config .hadolint
          output-file: hadolint-whatsapp.txt
          no-color: true
          no-fail: true

      - name: Lint — sms-processor/Dockerfile
        id: hl-sms
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          file: sms-processor/Dockerfile
          args: --config .hadolint
          output-file: hadolint-sms.txt
          no-color: true
          no-fail: true

      - name: Lint — recoll-audio-worker/Dockerfile
        id: hl-audio
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          file: recoll-audio-worker/Dockerfile
          args: --config .hadolint
          output-file: hadolint-audio.txt
          no-color: true
          no-fail: true

      - name: Combine results
        id: combine
        run: |
          show_result() {
            local title="$1" file="$2"
            echo "### $title"
            echo '```'
            if grep -q '[^[:space:]]' "$file" 2>/dev/null; then
              cat "$file"
            else
              echo "No issues found."
            fi
            echo ''
            echo '```'
            echo ""
          }
          {
            show_result "Dockerfile" hadolint-root.txt
            show_result "recoll-engine/Dockerfile" hadolint-engine.txt
            show_result "whatsapp-archiver/Dockerfile" hadolint-whatsapp.txt
            show_result "sms-processor/Dockerfile" hadolint-sms.txt
            show_result "recoll-audio-worker/Dockerfile" hadolint-audio.txt
          } > hadolint-results.md
          echo "results=$(base64 -w0 < hadolint-results.md)" >> "$GITHUB_OUTPUT"

      - name: Update Pull Request
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const encoded = "${{ steps.combine.outputs.results }}";
            const results = Buffer.from(encoded, "base64").toString("utf8");
            const outcome = "${{ job.status }}";
            const output = `#### Hadolint: \`${outcome}\`\n\n${results}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output,
            });

      - name: Fail on hadolint findings
        if: |
          steps.hl-root.outcome == 'failure' ||
          steps.hl-engine.outcome == 'failure' ||
          steps.hl-whatsapp.outcome == 'failure' ||
          steps.hl-sms.outcome == 'failure' ||
          steps.hl-audio.outcome == 'failure'
        run: echo "hadolint found issues" && exit 1

  docker:
    runs-on: ubuntu-latest
    needs: [hadolint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: recoll-webui
            context: .
            file: Dockerfile

          - image: recoll-engine
            context: .
            file: recoll-engine/Dockerfile

          - image: whatsapp-archiver
            context: ./whatsapp-archiver
            file: whatsapp-archiver/Dockerfile

          - image: sms-processor
            context: ./sms-processor
            file: sms-processor/Dockerfile

          - image: mbsync
            context: ./mbsync
            file: mbsync/Dockerfile

          - image: recoll-audio-worker
            context: ./recoll-audio-worker
            file: recoll-audio-worker/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Compute package hash for recoll-engine (needed for both PR and main)
      - name: Compute package hash (cache busting for recoll-engine)
        if: matrix.image == 'recoll-engine'
        id: pkg-hash
        run: |
          # Extract package list from RUN apt-get install line in Dockerfile
          # Hash it to create a cache-busting arg
          PKG_LINE=$(grep -A 30 'apt-get install' recoll-engine/Dockerfile | head -31 | tail -30 | sed 's/^[[:space:]]*//' | sed 's/\\$//' | tr '\n' ' ')
          echo "pkg_hash=$(echo -n "$PKG_LINE" | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # =====================
      # PR validation: use plain `docker build` (legacy builder) to avoid
      # cross-context cache pollution from buildx. Each matrix job runs
      # on its own runner with isolated Docker daemon.
      # =====================
      - name: Build image (PR validation)
        if: github.event_name == 'pull_request'
        run: |
          docker build \
            --no-cache \
            --file "${{ matrix.file }}" \
            --tag "${{ matrix.image }}:pr" \
            ${{ matrix.image == 'recoll-engine' && format('--build-arg PACKAGE_HASH={0}', steps.pkg-hash.outputs.pkg_hash) || '' }} \
            ${{ matrix.context }}

      # =====================
      # Main: build + publish with buildx, named builder, per-image GHA cache
      # =====================
      - name: Create buildx builder (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker-container
          name: builder-${{ matrix.image }}-${{ github.run_id }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata for tags
        id: meta
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "short_sha=$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      # Build and push for main branch
      - name: Build and push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          builder: builder-${{ matrix.image }}-${{ github.run_id }}
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          build-args: ${{ matrix.image == 'recoll-engine' && format('PACKAGE_HASH={0}', steps.pkg-hash.outputs.pkg_hash) || '' }}
