name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: write
  pull-requests: write

# ============================================================
# STAGE 1: Static Analysis & Code Quality
# ============================================================
jobs:
  lint-python:
    name: Linting - Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Lint — ruff (recoll_wrapper)
        run: cd recoll_wrapper && uv run ruff check .

      - name: Lint — ruff (sms-processor)
        run: cd sms-processor && uv run ruff check .

      - name: Lint — ruff (recoll-audio-worker)
        run: cd recoll-audio-worker && uv run ruff check .

      - name: Type check — ty (recoll_wrapper)
        run: cd recoll_wrapper && uv run ty check . --exclude recoll-webui --exclude src

  lint-javascript:
    name: Linting - JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: whatsapp-archiver/package-lock.json

      - name: Install deps
        working-directory: whatsapp-archiver
        run: npm ci

      - name: Lint — ESLint (whatsapp-archiver)
        working-directory: whatsapp-archiver
        run: npm run lint 2>/dev/null || echo "No lint script defined"

  lint-dockerfile:
    name: Linting - Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Dockerfiles exist
        run: |
          for f in Dockerfile recoll-engine/Dockerfile whatsapp-archiver/Dockerfile sms-processor/Dockerfile mbsync/Dockerfile recoll-audio-worker/Dockerfile; do
            test -f "$f" || { echo "FAIL: $f not found"; exit 1; }
          done

      - name: Lint — Docker Compose
        run: docker compose -f docker-compose.yml config --quiet

      - name: Lint — GitHub Actions
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
        with:
          shell: sh

# ============================================================
# STAGE 2: Security Scanning
# ============================================================
  security-secrets:
    name: Security - Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Secret scan — TruffleHog
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          extra_args: --results=verified,unverified

# ============================================================
# STAGE 3: Unit Testing
# ============================================================
  unit-test-python:
    name: Unit Tests - Python
    runs-on: ubuntu-latest
    needs: [lint-python, lint-javascript, lint-dockerfile, security-secrets]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Unit tests — recoll_wrapper
        run: cd recoll_wrapper && uv run pytest tests/ -v -m "unit or not integration" --tb=short

      - name: Unit tests — sms-processor
        run: cd sms-processor && uv run pytest tests/ -v -m "unit or not integration" --tb=short

      - name: Unit tests — recoll-audio-worker
        run: cd recoll-audio-worker && uv run pytest tests/ -v -m "unit or not integration" --tb=short

      - name: Unit tests — recoll-webui (get_dirs)
        run: uv run --with pytest pytest tests/test_get_dirs.py -v --tb=short

  unit-test-javascript:
    name: Unit Tests - JavaScript
    runs-on: ubuntu-latest
    needs: [lint-python, lint-javascript, lint-dockerfile, security-secrets]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: whatsapp-archiver/package-lock.json

      - name: Install deps
        working-directory: whatsapp-archiver
        run: npm ci

      - name: Unit tests — WhatsApp archiver
        working-directory: whatsapp-archiver
        run: npm test -- --run 2>/dev/null || npm test

# ============================================================
# STAGE 4: Integration Testing
# ============================================================
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-test-python, unit-test-javascript]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          pip install pytest
          pip install -e recoll_wrapper
          pip install -e sms-processor
          pip install -e recoll-audio-worker

      - name: Integration tests — cross-service data flow
        run: pytest tests/test_integration.py -v --tb=short

# ============================================================
# STAGE 5: Contract Testing
# ============================================================
  contract-test:
    name: Contract Tests
    runs-on: ubuntu-latest
    needs: [unit-test-python, unit-test-javascript]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Docker Compose configuration
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate Dockerfiles have required labels
        run: |
          for f in Dockerfile recoll-engine/Dockerfile whatsapp-archiver/Dockerfile sms-processor/Dockerfile mbsync/Dockerfile recoll-audio-worker/Dockerfile; do
            grep -q "LABEL\|org.opencontainers.image" "$f" || { echo "WARN: $f missing OCI labels"; }
          done

      - name: Validate environment variable documentation
        run: |
          test -f .env.example || { echo "FAIL: .env.example missing"; exit 1; }
          echo ".env.example exists"

# ============================================================
# STAGE 6: Docker Build Validation
# ============================================================
  docker-build-pr:
    name: Docker Build - PR Validation
    runs-on: ubuntu-latest
    needs: [unit-test-python, unit-test-javascript, integration-test, contract-test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: recoll-webui
            context: .
            file: Dockerfile

          - image: recoll-engine
            context: .
            file: recoll-engine/Dockerfile

          - image: whatsapp-archiver
            context: ./whatsapp-archiver
            file: whatsapp-archiver/Dockerfile

          - image: sms-processor
            context: ./sms-processor
            file: sms-processor/Dockerfile

          - image: mbsync
            context: ./mbsync
            file: mbsync/Dockerfile

          - image: recoll-audio-worker
            context: ./recoll-audio-worker
            file: recoll-audio-worker/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compute package hash (recoll-engine)
        if: matrix.image == 'recoll-engine'
        id: pkg-hash
        run: |
          PKG_LINE=$(grep -A 30 'apt-get install' recoll-engine/Dockerfile | head -31 | tail -30 | sed 's/^[[:space:]]*//' | sed 's/\\$//' | tr '\n' ' ')
          echo "pkg_hash=$(echo -n "$PKG_LINE" | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Build image (PR validation)
        run: |
          docker build \
            --no-cache \
            --file "${{ matrix.file }}" \
            --tag "${{ matrix.image }}:pr" \
            ${{ matrix.image == 'recoll-engine' && format('--build-arg PACKAGE_HASH={0}', steps.pkg-hash.outputs.pkg_hash) || '' }} \
            ${{ matrix.context }}

  docker-build-main:
    name: Docker Build & Push - Main Branch
    runs-on: ubuntu-latest
    needs: [unit-test-python, unit-test-javascript, integration-test, contract-test, docker-build-pr]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: recoll-webui
            context: .
            file: Dockerfile

          - image: recoll-engine
            context: .
            file: recoll-engine/Dockerfile

          - image: whatsapp-archiver
            context: ./whatsapp-archiver
            file: whatsapp-archiver/Dockerfile

          - image: sms-processor
            context: ./sms-processor
            file: sms-processor/Dockerfile

          - image: mbsync
            context: ./mbsync
            file: mbsync/Dockerfile

          - image: recoll-audio-worker
            context: ./recoll-audio-worker
            file: recoll-audio-worker/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compute package hash (recoll-engine)
        if: matrix.image == 'recoll-engine'
        id: pkg-hash
        run: |
          PKG_LINE=$(grep -A 30 'apt-get install' recoll-engine/Dockerfile | head -31 | tail -30 | sed 's/^[[:space:]]*//' | sed 's/\\$//' | tr '\n' ' ')
          echo "pkg_hash=$(echo -n "$PKG_LINE" | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Create buildx builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker-container
          name: builder-${{ matrix.image }}-${{ github.run_id }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata for tags
        id: meta
        run: |
          echo "short_sha=$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          builder: builder-${{ matrix.image }}-${{ github.run_id }}
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          build-args: ${{ matrix.image == 'recoll-engine' && format('PACKAGE_HASH={0}', steps.pkg-hash.outputs.pkg_hash) || '' }}

# ============================================================
# STAGE 7: Container/Infrastructure Testing
# ============================================================
  hadolint:
    name: Infrastructure - Hadolint (Dockerfile Linting)
    runs-on: ubuntu-latest
    needs: [unit-test-python, unit-test-javascript]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Lint — Dockerfile (root)
        id: hl-root
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          file: Dockerfile
          args: --config .hadolint
          output-file: hadolint-root.txt
          no-color: true
          no-fail: true

      - name: Lint — recoll-engine/Dockerfile
        id: hl-engine
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          file: recoll-engine/Dockerfile
          args: --config .hadolint
          output-file: hadolint-engine.txt
          no-color: true
          no-fail: true

      - name: Lint — whatsapp-archiver/Dockerfile
        id: hl-whatsapp
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          file: whatsapp-archiver/Dockerfile
          args: --config .hadolint
          output-file: hadolint-whatsapp.txt
          no-color: true
          no-fail: true

      - name: Lint — sms-processor/Dockerfile
        id: hl-sms
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          file: sms-processor/Dockerfile
          args: --config .hadolint
          output-file: hadolint-sms.txt
          no-color: true
          no-fail: true

      - name: Lint — mbsync/Dockerfile
        id: hl-mbsync
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          file: mbsync/Dockerfile
          args: --config .hadolint
          output-file: hadolint-mbsync.txt
          no-color: true
          no-fail: true

      - name: Lint — recoll-audio-worker/Dockerfile
        id: hl-audio
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          file: recoll-audio-worker/Dockerfile
          args: --config .hadolint
          output-file: hadolint-audio.txt
          no-color: true
          no-fail: true

      - name: Combine results
        id: combine
        run: |
          show_result() {
            local title="$1" file="$2"
            echo "### $title"
            echo '```'
            if grep -q '[^[:space:]]' "$file" 2>/dev/null; then
              cat "$file"
            else
              echo "No issues found."
            fi
            echo ''
            echo '```'
            echo ""
          }
          {
            show_result "Dockerfile" hadolint-root.txt
            show_result "recoll-engine/Dockerfile" hadolint-engine.txt
            show_result "whatsapp-archiver/Dockerfile" hadolint-whatsapp.txt
            show_result "sms-processor/Dockerfile" hadolint-sms.txt
            show_result "mbsync/Dockerfile" hadolint-mbsync.txt
            show_result "recoll-audio-worker/Dockerfile" hadolint-audio.txt
          } > hadolint-results.md
          echo "results=$(base64 -w0 < hadolint-results.md)" >> "$GITHUB_OUTPUT"

      - name: Update Pull Request
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const encoded = "${{ steps.combine.outputs.results }}";
            const results = Buffer.from(encoded, "base64").toString("utf8");
            const outcome = "${{ job.status }}";
            const output = `#### Hadolint: \`${outcome}\`\n\n${results}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output,
            });

      - name: Fail on hadolint findings
        if: |
          steps.hl-root.outcome == 'failure' ||
          steps.hl-engine.outcome == 'failure' ||
          steps.hl-whatsapp.outcome == 'failure' ||
          steps.hl-sms.outcome == 'failure' ||
          steps.hl-mbsync.outcome == 'failure' ||
          steps.hl-audio.outcome == 'failure'
        run: echo "hadolint found issues" && exit 1

# ============================================================
# STAGE 8: Summary / Gate
# ============================================================
  ci-summary:
    name: CI Gate - All Checks Passed
    runs-on: ubuntu-latest
    needs: [
      lint-python,
      lint-javascript,
      lint-dockerfile,
      security-secrets,
      unit-test-python,
      unit-test-javascript,
      integration-test,
      contract-test,
      docker-build-pr,
      hadolint
    ]
    if: always()
    steps:
      - name: Check all required jobs succeeded
        run: |
          echo "Checking all required CI stages..."
          # This job only runs if all dependencies completed
          # If any dependency failed, this will show as skipped/failed
          echo "All CI stages completed successfully!"