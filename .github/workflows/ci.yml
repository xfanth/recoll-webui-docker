name: CI

on:
  push:
    branches: [main, fix/folder-path-filtering]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml
      - name: Run tests
        run: |
          pytest -q tests/test_get_dirs.py
